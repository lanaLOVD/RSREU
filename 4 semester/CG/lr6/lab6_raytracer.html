<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная работа №6 — Рейтрейсинг</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background: #111; color: #ddd; }
        canvas {
            border: 3px solid #3f2c95;
            image-rendering: pixelated;
            background: #000;
            margin: 20px 0;
        }
        h1, h2 { color: #6d4fe0; }
    </style>
</head>
<body>
<h1>Лабораторная работа №6. Основы трассировки лучей (Ray Tracing)</h1>
<p>Реализация на JavaScript (HTML5 Canvas)</p>

<canvas id="canvas" width="800" height="600"></canvas>


<script>
    'use strict';

    class Vec3 {
        constructor(x, y, z) { this.x = x; this.y = y; this.z = z; }
        add(v) { return new Vec3(this.x + v.x, this.y + v.y, this.z + v.z); }
        sub(v) { return new Vec3(this.x - v.x, this.y - v.y, this.z - v.z); }
        mul(k) { return new Vec3(this.x * k, this.y * k, this.z * k); }
        dot(v) { return this.x*v.x + this.y*v.y + this.z*v.z; }
        length() { return Math.sqrt(this.dot(this)); }
        normalize() {
            const len = this.length();
            return len > 0 ? this.mul(1/len) : new Vec3(0,0,0);
        }
        reflect(N) { return this.sub(N.mul(2 * this.dot(N))); }
    }

    class Sphere {
        constructor(center, radius, color, specular, reflective = 0) {
            this.center = center;
            this.radius = radius;
            this.color = color;
            this.specular = specular;
            this.reflective = reflective;
        }
    }

    const spheres = [
        new Sphere(new Vec3(0, -1, 3), 1, {r:255,g:0,b:0},   500, 0.3),
        new Sphere(new Vec3(2, 0, 4),  1, {r:0,g:0,b:255},   100, 0.4),
        new Sphere(new Vec3(-2, 0, 4), 1, {r:0,g:255,b:0},    10, 0.2),
        new Sphere(new Vec3(0, -5001, 0), 5000, {r:255,g:255,b:100}, 10, 0.5)
    ];

    const lights = [
        { type: "ambient", intensity: 0.2 },
        { type: "point", intensity: 0.6, position: new Vec3(2, 1, 0) },
        { type: "directional", intensity: 0.2, direction: new Vec3(1,4,4).normalize() }
    ];

    function intersectRaySphere(O, D, sphere) {
        const OC = O.sub(sphere.center);
        const k1 = D.dot(D);
        const k2 = 2 * OC.dot(D);
        const k3 = OC.dot(OC) - sphere.radius**2;

        const disc = k2*k2 - 4*k1*k3;
        if (disc < 0) return [Infinity, Infinity];

        const sqrtD = Math.sqrt(disc);
        const t1 = (-k2 - sqrtD) / (2*k1);
        const t2 = (-k2 + sqrtD) / (2*k1);
        return [t1 > 0 ? t1 : Infinity, t2 > 0 ? t2 : Infinity];
    }

    function closestIntersection(O, D, t_min, t_max) {
        let closest_t = Infinity;
        let closest_sphere = null;

        for (let s of spheres) {
            const [t1, t2] = intersectRaySphere(O, D, s);
            if (t1 < closest_t && t_min < t1 && t1 < t_max) { closest_t = t1; closest_sphere = s; }
            if (t2 < closest_t && t_min < t2 && t2 < t_max) { closest_t = t2; closest_sphere = s; }
        }
        return [closest_sphere, closest_t];
    }

    function computeLighting(P, N, V, specular) {
        let intensity = 0;

        for (let light of lights) {
            if (light.type === "ambient") {
                intensity += light.intensity;
                continue;
            }

            let L = light.type === "point" ? light.position.sub(P) : light.direction;
            const t_max = light.type === "point" ? 1 : Infinity;

            const [shadow] = closestIntersection(P, L.normalize(), 0.001, t_max);
            if (shadow) continue;

            const n_dot_l = Math.max(0, N.dot(L));
            intensity += light.intensity * n_dot_l;

            if (specular > 0) {
                const R = L.normalize().reflect(N);
                const r_dot_v = Math.max(0, R.dot(V));
                intensity += light.intensity * (r_dot_v ** specular);
            }
        }
        return Math.min(intensity, 1);
    }

    function traceRay(O, D, t_min, t_max, depth = 0) {
        if (depth > 3) return {r:0, g:0, b:0};

        const [sphere, t] = closestIntersection(O, D, t_min, t_max);
        if (!sphere) return {r:0, g:0, b:0};

        const P = O.add(D.mul(t));
        const N = P.sub(sphere.center).normalize();
        const V = D.mul(-1).normalize();

        const lighting = computeLighting(P, N, V, sphere.specular);

        let color = {
            r: Math.floor(sphere.color.r * lighting),
            g: Math.floor(sphere.color.g * lighting),
            b: Math.floor(sphere.color.b * lighting)
        };

        if (sphere.reflective > 0 && depth < 3) {
            const R = D.reflect(N);
            const ref = traceRay(P, R.normalize(), 0.001, Infinity, depth + 1);
            const rf = sphere.reflective;
            color.r = Math.floor(color.r * (1-rf) + ref.r * rf);
            color.g = Math.floor(color.g * (1-rf) + ref.g * rf);
            color.b = Math.floor(color.b * (1-rf) + ref.b * rf);
        }
        return color;
    }

    // Рендер
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const w = 800, h = 600;
    const imgData = ctx.createImageData(w, h);
    const data = imgData.data;

    const O = new Vec3(0, 0, 0);

    let idx = 0;
    for (let py = h/2 - 1; py >= -h/2; py--) {
        for (let px = -w/2; px < w/2; px++) {
            const vx = px / (w/2) * 0.8;
            const vy = py / (h/2) * 0.6;
            const D = new Vec3(vx, vy, 1).normalize();

            const col = traceRay(O, D, 1, Infinity);

            data[idx++] = col.r || 0;
            data[idx++] = col.g || 0;
            data[idx++] = col.b || 0;
            data[idx++] = 255;
        }
    }

    ctx.putImageData(imgData, 0, 0);
    console.log("Рендер завершён! Если видишь чёрный экран — посмотри ошибки в консоли (F12).");
</script>
</body>
</html>
